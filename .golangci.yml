version: "2"
linters:
  default: all
  disable:
    - depguard
    - dupl
    - err113
    - exhaustruct
    - funlen
    - gochecknoglobals
    - godoclint
    - ireturn
    - lll
    - mnd
    - nonamedreturns
    - perfsprint
    - testpackage
    - varnamelen
    - wrapcheck
    - wsl
    - gomodguard
    - nolintlint
    - noinlineerr

  settings:
    cyclop:
      max-complexity: 15

    errorlint:
      errorf: false

    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^print(ln)?$
          msg: Do not commit print statements.

        - pattern: ^fmt\.Print.*$
          msg: Do not commit print statements.

        - pattern: ^log.Fatal.*$
          msg: Do not terminate process from business code

        - pattern: ^os.Exit.*$
          msg: Do not terminate process from business code (Allowed only in main.go)

        - pattern: ^panic$
          msg: panic() in main is forbidden. Use os.Exit(1) instead

    gocritic:
      enable-all: true
      disabled-checks:
        - hugeParam
        - rangeValCopy
        - importShadow

    gosec:
      excludes:
        - G705
        - G117
        - G703

    nestif:
      min-complexity: 7

    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true

    reassign:
      patterns:
        - .*

    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow

    makezero:
      always: true

    nilnil:
      detect-opposite: true

    prealloc:
      for-loops: true

    revive:
      enable-all-rules: true
      rules:
        - name: unexported-return
          disabled: true

        - name: exported
          disabled: true

        - name: line-length-limit
          disabled: true

        - name: add-constant
          disabled: true

        - name: unhandled-error
          arguments:
            - "^fmt.Print.*"
            - "strings.Builder.Write.*"
            - "bytes.Buffer.Write.*"

        - name: var-naming
          disabled: true

        - name: nested-structs
          disabled: true

        - name: max-public-structs
          disabled: true

        - name: function-length
          disabled: true

        - name: import-shadowing
          disabled: true

        - name: import-alias-naming
          arguments:
            - allow-regex: "^[a-z][a-z0-9_]*$"

        - name: empty-block
          disabled: true

        - name: confusing-naming
          disabled: true

        - name: exported
          disabled: true

        - name: unused-receiver
          disabled: true

        - name: indent-error-flow
          disabled: true

        - name: early-return
          disabled: true

        - name: argument-limit
          disabled: true

        - name: cognitive-complexity
          disabled: true

        - name: cyclomatic
          arguments:
            - 15

        - name: get-return
          disabled: true

        - name: struct-tag
          disabled: true

        - name: package-naming
          arguments:
            - convention-name-check-regex: "^[a-z][a-z0-9_]*$"

    testifylint:
      enable-all: true

    usestdlibvars:
      time-date-month: true
      time-month: true
      time-layout: true
      crypto-hash: true
      default-rpc-path: true
      sql-isolation-level: true
      tls-signature-scheme: true
      constant-kind: true

    errcheck:
      check-type-assertions: true
      check-blank: true

    staticcheck:
      checks:
        - all

        - -S1008
        - -SA9003
        - -ST1003

    tagliatelle:
      case:
        rules:
          avro: snake
          bson: snake
          env: snake
          envconfig: upperSnake
          json: snake
          mapstructure: snake
          toml: snake
          whatever: snake
          xml: snake
          yaml: snake

    wsl_v5:
      allow-first-in-block: false
      default: "all"
      disable:
        - after-expr
        - assign-exclusive
        - assign-expr

  exclusions:
    presets:
      - comments
      - common-false-positives

    rules:
      - path: '(^|.*/)main\.go$'
        text: 'Do not terminate process from business code \(Allowed only in main\.go\)'
        linters:
          - forbidigo

      - path-except: '(^|.*/)main\.go$'
        linters:
          - forbidigo
        text: 'panic\(\) in main is forbidden\. Use os\.Exit\(1\) instead'

      - path: "_test\\.go$"
        linters:
          - dupl
          - goconst
          - funlen
          - noctx

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - blank
        - dot
        - default
        - prefix(github.com)
        - localmodule
      custom-order: true

    gofumpt:
      extra-rules: true

issues:
  max-same-issues: 0

run:
  relative-path-mode: gomod
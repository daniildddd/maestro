global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: kafka-connect
    static_configs:
      - targets: ['connect:8084']
  - job_name: maestro
    static_configs:
      - targets: ['maestro:9100']

services:
  postgres:
    image: postgres:17-alpine
    container_name: maestro-postgres
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 3

    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1
    container_name: maestro-kafka
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
    ports:
      - "127.0.0.1:9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10

  connect:
    image: quay.io/debezium/connect:3.5.2
    container_name: maestro-connect
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - BOOTSTRAP_SERVERS=kafka:9092
      - GROUP_ID=maestro-connect
      - CONFIG_STORAGE_TOPIC=maestro_connect_configs
      - OFFSET_STORAGE_TOPIC=maestro_connect_offsets
      - STATUS_STORAGE_TOPIC=maestro_connect_status
      - CONFIG_STORAGE_REPLICATION_FACTOR=1
      - OFFSET_STORAGE_REPLICATION_FACTOR=1
      - STATUS_STORAGE_REPLICATION_FACTOR=1
      - CONNECT_REST_ADVERTISED_HOST_NAME=connect
      - KAFKA_OPTS=-javaagent:/opt/jmx-exporter/jmx_prometheus_javaagent.jar=8084:/opt/jmx-exporter/config.yml
    volumes:
      - ./deploy/jmx-exporter/jmx_prometheus_javaagent.jar:/opt/jmx-exporter/jmx_prometheus_javaagent.jar
      - ./deploy/jmx-exporter/config.yml:/opt/jmx-exporter/config.yml
    ports:
      - "127.0.0.1:8083:8083"
      - "127.0.0.1:8084:8084"

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: maestro-prometheus
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ./migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"

  actionlint:
    image: rhysd/actionlint:1.7.12
    volumes:
      - .:/code:ro
    working_dir: /code

    restart: "no"

  hadolint:
    image: hadolint/hadolint:v2.15.1
    volumes:
      - .:/code:ro
    working_dir: /code
    entrypoint: ["hadolint"]

    restart: "no"

  trivy:
    image: aquasec/trivy:0.74.0
    volumes:
      - .:/code:ro
      - trivy_cache:/root/.cache
    working_dir: /code
    entrypoint: ["trivy"]

    restart: "no"

volumes:
  postgres_data:
    name: maestro_postgres_data
  prometheus_data:
    name: maestro_prometheus_data
  trivy_cache:
    name: maestro_trivy_cache
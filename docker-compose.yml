services:
  maestro-postgres:
    image: postgres:17-alpine
    container_name: maestro-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 3

    restart: unless-stopped

  maestro-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ./migrations:/migrations
    depends_on:
      maestro-postgres:
        condition: service_healthy

    restart: "no"

  maestro-actionlint:
    image: rhysd/actionlint:1.7.12
    volumes:
      - .:/code:ro
    working_dir: /code

    restart: "no"

  maestro-hadolint:
    image: hadolint/hadolint:v2.15.1
    volumes:
      - .:/code:ro
    working_dir: /code
    entrypoint: ["hadolint"]

    restart: "no"

  maestro-trivy:
    image: aquasec/trivy:0.74.0
    volumes:
      - .:/code:ro
      - trivy_cache:/root/.cache
    working_dir: /code
    entrypoint: ["trivy"]

    restart: "no"

volumes:
  postgres_data:
    name: maestro_postgres_data
  trivy_cache:
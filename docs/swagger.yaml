openapi: 3.0.0
info:
  title: Maestro API
  version: 1.0.0
  description: API for Maestro application
paths:
  /api/v1/login:
    post:
      tags:
        - auth
      summary: User login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: jdoe
                password:
                  type: string
                  example: secret123
      responses:
        '200':
          description: Successful login
          headers:
            Set-Cookie:
              description: Cookie containing refresh_token
              schema:
                type: string
                example: refresh_token=abcde12345; HttpOnly; Path=/
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    example: eyJhb...
                  username:
                    type: string
                    example: jdoe
                  role:
                    type: string
                    example: admin
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation_error:
                  summary: Validation error
                  value:
                    code: BAD_REQUEST
                    message: "Validation failed: missing required fields"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_credentials:
                  summary: Invalid credentials
                  value:
                    code: INVALID_CREDENTIALS
                    message: "Invalid email or password"
  /api/v1/refresh:
    post:
      tags:
        - auth
      summary: Refresh access token
      operationId: refresh
      parameters:
        - in: cookie
          name: refresh_token
          schema:
            type: string
          required: true
          description: The refresh token cookie
      responses:
        '200':
          description: Successful refresh
          headers:
            Set-Cookie:
              description: Cookie containing new refresh_token
              schema:
                type: string
                example: refresh_token=fghij67890; HttpOnly; Path=/
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    example: eyJhb...
        '401':
          description: Unauthorized or invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_token:
                  summary: Invalid refresh token
                  value:
                    code: INVALID_TOKEN
                    message: "Refresh token is expired, missing or invalid"
  /api/v1/logout:
    post:
      tags:
        - auth
      summary: User logout
      operationId: logout
      parameters:
        - in: cookie
          name: refresh_token
          schema:
            type: string
          required: true
          description: The refresh token cookie
      requestBody:
        description: Access token for logging purposes
        content:
          application/json:
            schema:
              type: object
              properties:
                access_token:
                  type: string
                  example: eyJhb...
      responses:
        '200':
          description: Successful logout
          headers:
            Set-Cookie:
              description: Cookie invalidating the refresh_token
              schema:
                type: string
                example: refresh_token=; Max-Age=0; HttpOnly; Path=/
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                bad_request:
                  summary: Invalid request payload
                  value:
                    code: BAD_REQUEST
                    message: "Missing access_token in request body"
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: refresh_token

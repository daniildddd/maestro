                  value:
                    code: ACCESS_TOKEN_MISSING
                    message: "Access token missing"
                access_token_expired:
                  summary: Access token expired
                  value:
                    code: ACCESS_TOKEN_EXPIRED
                    message: "Access token expired"
                access_token_invalid:
                  summary: Invalid access token
                  value:
                    code: ACCESS_TOKEN_INVALID
                    message: "Invalid access token"
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  summary: Forbidden
                  value:
                    code: FORBIDDEN
                    message: "Forbidden"
    get:
      tags:
        - users
      summary: Get list of users
      operationId: getUsers
      x-required-roles: [admin]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: username
          schema:
            type: string
            minLength: 3
            maxLength: 32
            pattern: '^[a-zA-Z0-9_-]+$'
        - in: query
          name: role
          schema:
            type: string
            enum: [admin, user]
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation_error:
                  summary: Validation error
                  value:
                    code: VALIDATION_FAILED
                    message: "Validation failed"
                invalid_query_param:
                  summary: Invalid query parameter
                  value:
                    code: INVALID_QUERY_PARAM
                    message: "Invalid query parameter"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                access_token_missing:
                  summary: Access token missing
                  value:
                    code: ACCESS_TOKEN_MISSING
                    message: "Access token missing"
                access_token_expired:
                  summary: Access token expired
                  value:
                    code: ACCESS_TOKEN_EXPIRED
                    message: "Access token expired"
                access_token_invalid:
                  summary: Invalid access token
                  value:
                    code: ACCESS_TOKEN_INVALID
                    message: "Invalid access token"
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  summary: Forbidden
                  value:
                    code: FORBIDDEN
                    message: "Forbidden"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  summary: User not found
                  value:
                    code: USER_NOT_FOUND
                    message: "User with provided ID not found"
  /api/v1/users/{id}:

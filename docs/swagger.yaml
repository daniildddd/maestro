        content:
          application/json:
            schema:
              type: object
              required:
                - new_password
              properties:
                new_password:
                  type: string
                  minLength: 8
                  maxLength: 128
                  pattern: '^[^\x00-\x1F\x7F]+$'
                  example: newSecret123
                  description: New plaintext password. Control characters (0x00-0x1F, 0x7F) are forbidden; spaces are allowed.
      responses:
        '204':
          description: Password changed successfully
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation_error:
                  summary: Validation error
                  value:
                    code: VALIDATION_FAILED
                    message: "Validation failed"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                access_token_missing:
                  summary: Access token missing
                  value:
                    code: ACCESS_TOKEN_MISSING
                    message: "Access token missing"
                access_token_expired:
                  summary: Access token expired
                  value:
                    code: ACCESS_TOKEN_EXPIRED
                    message: "Access token expired"
                access_token_invalid:
                  summary: Invalid access token
                  value:
                    code: ACCESS_TOKEN_INVALID
                    message: "Invalid access token"
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  summary: Forbidden
                  value:
                    code: FORBIDDEN
                    message: "Forbidden"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  summary: User not found
                  value:
                    code: USER_NOT_FOUND
                    message: "User with provided ID not found"
  /api/v1/users/me/password:
    patch:
      tags:
        - users
      summary: User changes their own password
      operationId: changeOwnPassword
      x-required-roles: [user, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - old_password
                - new_password
              properties:
                old_password:
                  type: string
                  minLength: 8
                  maxLength: 128
                  pattern: '^[^\x00-\x1F\x7F]+$'
                  example: oldSecret123
                new_password:
                  type: string
                  minLength: 8
                  maxLength: 128
                  pattern: '^[^\x00-\x1F\x7F]+$'
                  example: newSecret123
                  description: New plaintext password. Control characters (0x00-0x1F, 0x7F) are forbidden; spaces are allowed.
      responses:
        '204':
          description: Password changed successfully
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation_error:
                  summary: Validation error
                  value:
                    code: VALIDATION_FAILED
                    message: "Validation failed"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                access_token_missing:
                  summary: Access token missing
                  value:
                    code: ACCESS_TOKEN_MISSING
                    message: "Access token missing"
                access_token_expired:
                  summary: Access token expired
                  value:
                    code: ACCESS_TOKEN_EXPIRED
                    message: "Access token expired"
                access_token_invalid:
                  summary: Invalid access token
                  value:
                    code: ACCESS_TOKEN_INVALID
                    message: "Invalid access token"
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  summary: Forbidden
                  value:
                    code: FORBIDDEN
                    message: "Forbidden"
  /api/v1/users/me:
    delete:
      tags:
        - users
      summary: Delete own account
      operationId: deleteOwnAccount
      x-required-roles: [user, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                  pattern: '^[^\x00-\x1F\x7F]+$'
                  example: mySecret123
                  description: Current password to confirm account deletion. Control characters (0x00-0x1F, 0x7F) are forbidden; spaces are allowed.
      responses:
        '204':
          description: Account deleted successfully
        '400':
          description: Invalid request or incorrect password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_credentials:
                  summary: Incorrect password
                  value:
                    code: INVALID_CREDENTIALS
                    message: "Invalid credentials"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                access_token_missing:
                  summary: Access token missing
                  value:
                    code: ACCESS_TOKEN_MISSING
                    message: "Access token missing"
                access_token_expired:
                  summary: Access token expired
                  value:
                    code: ACCESS_TOKEN_EXPIRED
                    message: "Access token expired"
                access_token_invalid:
                  summary: Invalid access token
                  value:
                    code: ACCESS_TOKEN_INVALID
                    message: "Invalid access token"
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  summary: Forbidden
                  value:
                    code: FORBIDDEN
                    message: "Forbidden"
  /api/v1/connectors:
    get:
      tags:
        - connectors
      summary: Get connectors list
      operationId: getConnectors

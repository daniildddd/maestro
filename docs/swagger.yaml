openapi: 3.0.0
info:
  title: Maestro API
  version: 1.0.0
  description: API for Maestro application
security:
  - bearerAuth: []
paths:
  /api/v1/login:
    post:
      tags:
        - auth
      summary: User login
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 32
                  pattern: '^[a-zA-Z0-9_-]+$'
                  example: jdoe
                  description: Unique login identifier. ASCII letters, digits, underscore and hyphen only.
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                  pattern: '^[^\x00-\x1F\x7F]+$'
                  example: secret123
                  description: Plaintext password. Control characters (0x00-0x1F, 0x7F) are forbidden; spaces are allowed.
      responses:
        '200':
          description: Successful login
          headers:
            Set-Cookie:
              description: Cookie containing refresh_token
              schema:
                type: string
                example: refresh_token=abcde12345; HttpOnly; Path=/
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    example: eyJhb...
                    description: |
                        JWT. Decoded payload example:
                        {
                          "sub": "1234567890",
                          "role": "admin",
                          "iat": 1516239022,
                          "exp": 1516242622
                        }
                  username:
                    type: string
                    example: John Doe
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation_error:
                  summary: Validation error
                  value:
                    code: VALIDATION_FAILED
                    message: "Validation failed"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_credentials:
                  summary: Invalid credentials
                  value:
                    code: INVALID_CREDENTIALS
                    message: "Invalid credentials"
  /api/v1/refresh:
    post:
      tags:
        - auth
      summary: Refresh access token
      operationId: refresh
      security:
        - cookieAuth: []
      parameters:
        - in: cookie
          name: refresh_token
          schema:
            type: string
          required: true
          description: The refresh token cookie
      responses:
        '200':
          description: Successful refresh
          headers:
            Set-Cookie:
              description: Cookie containing new refresh_token
              schema:
                type: string
                example: refresh_token=fghij67890; HttpOnly; Path=/
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    example: eyJhb...
        '401':
          description: Unauthorized or invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_token:
                  summary: Invalid refresh token
                  value:
                    code: INVALID_REFRESH_TOKEN
                    message: "Invalid refresh token"
                expired_token:
                  summary: Expired refresh token
                  value:
                    code: INVALID_REFRESH_TOKEN
                    message: "Session expired"
                missing_token:
                  summary: Missing refresh token
                  value:
                    code: INVALID_REFRESH_TOKEN
                    message: "Refresh token is required"
  /api/v1/logout:
    post:
      tags:
        - auth
      summary: User logout
      operationId: logout
      parameters:
        - in: cookie
          name: refresh_token
          schema:
            type: string
          required: true
          description: The refresh token cookie
      responses:
        '204':
          description: Successful logout
          headers:
            Set-Cookie:
              description: Cookie invalidating the refresh_token
              schema:
                type: string
              example: refresh_token=; Max-Age=0; HttpOnly; Path=/; Secure; SameSite=Strict
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                access_token_missing:
                  summary: Access token missing
                  value:
                    code: ACCESS_TOKEN_MISSING
                    message: "Access token missing"
                access_token_expired:
                  summary: Access token expired
                  value:
                    code: ACCESS_TOKEN_EXPIRED
                    message: "Access token expired"
                access_token_invalid:
                  summary: Invalid access token
                  value:
                    code: ACCESS_TOKEN_INVALID
                    message: "Invalid access token"
  /api/v1/audit-logs:
    get:
      tags:
        - audit
      summary: Get audit logs list
      operationId: getAuditLogs
      x-required-roles: [user, admin]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: action
          schema:
            type: string
        - in: query
          name: connector
          schema:
            type: string
        - in: query
          name: actor
          schema:
            type: string
        - in: query
          name: start_data
          schema:
            type: string
            format: date-time
        - in: query
          name: end_data
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        created_at:
                          type: string
                        action:
                          type: string
                        user_name:
                          type: string
                        user_id:
                          type: string
                        connector_name:
                          type: string
                        connector_id:
                          type: string
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                bad_request:
                  summary: Invalid query parameters
                  value:
                    code: BAD_REQUEST
                    message: "Invalid query parameters provided"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                access_token_missing:
                  summary: Access token missing
                  value:
                    code: ACCESS_TOKEN_MISSING
                    message: "Access token missing"
                access_token_expired:
                  summary: Access token expired
                  value:
                    code: ACCESS_TOKEN_EXPIRED
                    message: "Access token expired"
                access_token_invalid:
                  summary: Invalid access token
                  value:
                    code: ACCESS_TOKEN_INVALID
                    message: "Invalid access token"
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  summary: Forbidden
                  value:
                    code: FORBIDDEN
                    message: "Forbidden"
  /api/v1/audit-logs/{id}:
    get:
      tags:
        - audit
      summary: Get specific audit log by ID
      operationId: getAuditLogById
      x-required-roles: [user, admin]
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  state_before:
                    type: object
                  state_after:
                    type: object
                  action:
                    type: string
                  connector_name:
                    type: string
                  user_name:
                    type: string
                  user_id:
                    type: string
                  connector_id:
                    type: string
                  created_at:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                access_token_missing:
                  summary: Access token missing
                  value:
                    code: ACCESS_TOKEN_MISSING
                    message: "Access token missing"
                access_token_expired:
                  summary: Access token expired
                  value:
                    code: ACCESS_TOKEN_EXPIRED
                    message: "Access token expired"
                access_token_invalid:
                  summary: Invalid access token
                  value:
                    code: ACCESS_TOKEN_INVALID
                    message: "Invalid access token"
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  summary: Forbidden
                  value:
                    code: FORBIDDEN
                    message: "Forbidden"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  summary: Log not found
                  value:
                    code: NOT_FOUND
                    message: "Audit log with provided ID not found"
  /api/v1/users:
    post:
      tags:
        - users
      summary: Create a new user
      operationId: createUser
      x-required-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation_error:
                  summary: Validation error
                  value:
                    code: VALIDATION_FAILED
                    message: "Validation failed"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                access_token_missing:

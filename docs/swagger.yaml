      tags:
        - users
      summary: Get user by ID
      operationId: getUserById
      x-required-roles: [user, admin]
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:

openapi: 3.0.0
info:
  title: Maestro API
  version: 1.0.0
  description: API for Maestro application
paths:
  /api/v1/login:
    post:
      tags:
        - auth
      summary: User login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: jdoe
                password:
                  type: string
                  example: secret123
      responses:
        '200':
          description: Successful login
          headers:
            Set-Cookie:
              description: Cookie containing refresh_token
              schema:
                type: string
                example: refresh_token=abcde12345; HttpOnly; Path=/
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    example: eyJhb...
                  username:
                    type: string
                    example: jdoe
                  role:
                    type: string
                    example: admin
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation_error:
                  summary: Validation error
                  value:
                    code: BAD_REQUEST
                    message: "Validation failed: missing required fields"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_credentials:
                  summary: Invalid credentials
                  value:
                    code: INVALID_CREDENTIALS
                    message: "Invalid email or password"
  /api/v1/refresh:
    post:
      tags:
        - auth
      summary: Refresh access token
      operationId: refresh
      parameters:
        - in: cookie
          name: refresh_token
          schema:
            type: string
          required: true
          description: The refresh token cookie
      responses:
        '200':
          description: Successful refresh
          headers:
            Set-Cookie:
              description: Cookie containing new refresh_token
              schema:
                type: string
                example: refresh_token=fghij67890; HttpOnly; Path=/
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    example: eyJhb...
        '401':
          description: Unauthorized or invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_token:
                  summary: Invalid refresh token
                  value:
                    code: INVALID_TOKEN
                    message: "Refresh token is expired, missing or invalid"
  /api/v1/logout:
    post:
      tags:
        - auth
      summary: User logout
      operationId: logout
      parameters:
        - in: cookie
          name: refresh_token
          schema:
            type: string
          required: true
          description: The refresh token cookie
      requestBody:
        description: Access token for logging purposes
        content:
          application/json:
            schema:
              type: object
              properties:
                access_token:
                  type: string
                  example: eyJhb...
      responses:
        '200':
          description: Successful logout
          headers:
            Set-Cookie:
              description: Cookie invalidating the refresh_token
              schema:
                type: string
                example: refresh_token=; Max-Age=0; HttpOnly; Path=/
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                bad_request:
                  summary: Invalid request payload
                  value:
                    code: BAD_REQUEST
                    message: "Missing access_token in request body"
  /api/v1/audit-logs:
    get:
      tags:
        - audit
      summary: Get audit logs list
      operationId: getAuditLogs
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: action
          schema:
            type: string
        - in: query
          name: connector
          schema:
            type: string
        - in: query
          name: actor
          schema:
            type: string
        - in: query
          name: start_data
          schema:
            type: string
        - in: query
          name: end_data
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        created_at:
                          type: string
                        action:
                          type: string
                        user_name:
                          type: string
                        user_id:
                          type: string
                        connector_name:
                          type: string
                        connector_id:
                          type: string
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      page:
                        type: integer
                      limit:
                        type: integer
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                bad_request:
                  summary: Invalid query parameters
                  value:
                    code: BAD_REQUEST
                    message: "Invalid query parameters provided"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: Unauthorized
                  value:
                    code: UNAUTHORIZED
                    message: "Missing or invalid token"
  /api/v1/audit-logs/{id}:
    get:
      tags:
        - audit
      summary: Get specific audit log by ID
      operationId: getAuditLogById
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  state_before:
                    type: object
                  state_after:
                    type: object
                  action:
                    type: string
                  connector_name:
                    type: string
                  user_name:
                    type: string
                  user_id:
                    type: string
                  connector_id:
                    type: string
                  created_at:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: Unauthorized
                  value:
                    code: UNAUTHORIZED
                    message: "Missing or invalid token"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  summary: Log not found
                  value:
                    code: NOT_FOUND
                    message: "Audit log with provided ID not found"
  /api/v1/users:
    post:
      tags:
        - users
      summary: Create a new user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
                - role
              properties:
                username:
                  type: string
                  example: newuser
                password:
                  type: string
                  example: secret123
                role:
                  type: string
                  example: admin
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  username:
                    type: string
                  role:
                    type: string
                  created_at:
                    type: string
                  updated_at:
                    type: string
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation_error:
                  summary: Validation error
                  value:
                    code: BAD_REQUEST
                    message: "Validation failed: missing required fields"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: Unauthorized
                  value:
                    code: UNAUTHORIZED
                    message: "Missing or invalid token"
    get:
      tags:
        - users
      summary: Get list of users
      operationId: getUsers
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: username
          schema:
            type: string
        - in: query
          name: role
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        username:
                          type: string
                        role:
                          type: string
                        created_at:
                          type: string
                        updated_at:
                          type: string
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      page:
                        type: integer
                      limit:
                        type: integer
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                bad_request:
                  summary: Invalid query parameters
                  value:
                    code: BAD_REQUEST
                    message: "Invalid query parameters provided"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: Unauthorized
                  value:
                    code: UNAUTHORIZED
                    message: "Missing or invalid token"
  /api/v1/users/{id}:
    get:
      tags:
        - users
      summary: Get user by ID
      operationId: getUserById
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  username:
                    type: string
                  role:
                    type: string
                  created_at:
                    type: string
                  updated_at:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: Unauthorized
                  value:
                    code: UNAUTHORIZED
                    message: "Missing or invalid token"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  summary: User not found
                  value:
                    code: NOT_FOUND
                    message: "User with provided ID not found"
    patch:
      tags:
        - users
      summary: Update user profile
      operationId: updateUser
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: updateduser
                role:
                  type: string
                  enum: [admin, user, viewer]
                  example: user
      responses:
        '200':
          description: Successful update
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  username:
                    type: string
                  role:
                    type: string
                  created_at:
                    type: string
                  updated_at:
                    type: string
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation_error:
                  summary: Validation error
                  value:
                    code: BAD_REQUEST
                    message: "Validation failed"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: Unauthorized
                  value:
                    code: UNAUTHORIZED
                    message: "Missing or invalid token"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  summary: User not found
                  value:
                    code: NOT_FOUND
                    message: "User with provided ID not found"
    delete:
      tags:
        - users
      summary: Delete user
      operationId: deleteUser
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        '204':
          description: User deleted successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: Unauthorized
                  value:
                    code: UNAUTHORIZED
                    message: "Missing or invalid token"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  summary: User not found
                  value:
                    code: NOT_FOUND
                    message: "User with provided ID not found"
  /api/v1/users/{id}/password:
    patch:
      tags:
        - users
      summary: Admin changes user password
      operationId: adminChangeUserPassword
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - new_password
              properties:
                new_password:
                  type: string
                  example: newSecret123
      responses:
        '204':
          description: Password changed successfully
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation_error:
                  summary: Validation error
                  value:
                    code: BAD_REQUEST
                    message: "Validation failed: missing required fields"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: Unauthorized
                  value:
                    code: UNAUTHORIZED
                    message: "Missing or invalid token"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  summary: User not found
                  value:
                    code: NOT_FOUND
                    message: "User not found"
  /api/v1/users/me/password:
    patch:
      tags:
        - users
      summary: User changes their own password
      operationId: changeOwnPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - old_password
                - new_password
              properties:
                old_password:
                  type: string
                  example: oldSecret123
                new_password:
                  type: string
                  example: newSecret123
      responses:
        '204':
          description: Password changed successfully
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation_error:
                  summary: Validation error
                  value:
                    code: BAD_REQUEST
                    message: "Validation failed or incorrect old password"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: Unauthorized
                  value:
                    code: UNAUTHORIZED
                    message: "Missing or invalid token"
  /api/v1/connectors:
    get:
      tags:
        - connectors
      summary: Get connectors list
      operationId: getConnectors
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: source_db
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        source_db:
                          type: string
                        status:
                          type: string
                        lag_ms:
                          type: integer
                        tasks_count:
                          type: integer
                        created_at:
                          type: string
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      page:
                        type: integer
                      limit:
                        type: integer
                  cluster_stats:
                    type: object
                    properties:
                      failed_connectors:
                        type: integer
                      running_connectors:
                        type: integer
                      paused_connectors:
                        type: integer
                      records_second:
                        type: integer
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                bad_request:
                  summary: Invalid query parameters
                  value:
                    code: BAD_REQUEST
                    message: "Invalid query parameters provided"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: Unauthorized
                  value:
                    code: UNAUTHORIZED
                    message: "Missing or invalid token"
    post:
      tags:
        - connectors
      summary: Create a new connector
      operationId: createConnector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - plugin_type
                - config
              properties:
                name:
                  type: string
                plugin_type:
                  type: string
                config:
                  type: object
                  description: Connector configuration including DB connection properties, converters, and optional SMTs.
            examples:
              postgres_example:
                summary: PostgreSQL Connector with JSON Converter and SMT
                value:
                  name: "pg-connector"
                  plugin_type: "io.debezium.connector.postgresql.PostgresConnector"
                  config:
                    "database.hostname": "localhost"
                    "database.port": "5432"
                    "database.user": "postgres"
                    "database.password": "postgres"
                    "database.dbname": "testdb"
                    "plugin.name": "pgoutput"
                    "key.converter": "org.apache.kafka.connect.json.JsonConverter"
                    "value.converter": "org.apache.kafka.connect.json.JsonConverter"
                    "transforms": "unwrap"
                    "transforms.unwrap.type": "io.debezium.transforms.ExtractNewRecordState"
              mysql_example:
                summary: MySQL Connector with Avro Converter
                value:
                  name: "mysql-connector"
                  plugin_type: "io.debezium.connector.mysql.MySqlConnector"
                  config:
                    "database.hostname": "mysql"
                    "database.port": "3306"
                    "database.user": "debezium"
                    "database.password": "dbz"
                    "database.server.id": "184054"
                    "database.include.list": "inventory"
                    "key.converter": "io.confluent.connect.avro.AvroConverter"
                    "value.converter": "io.confluent.connect.avro.AvroConverter"
                    "key.converter.schema.registry.url": "http://schema-registry:8081"
                    "value.converter.schema.registry.url": "http://schema-registry:8081"
      responses:
        '201':
          description: Connector created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  source_db:
                    type: string
                  status:
                    type: string
                  lag:
                    type: integer
                  tasks_count:
                    type: integer
                  created_at:
                    type: string
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                bad_request:
                  summary: Invalid request
                  value:
                    code: BAD_REQUEST
                    message: "Invalid configuration provided"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: Unauthorized
                  value:
                    code: UNAUTHORIZED
                    message: "Missing or invalid token"
  /api/v1/connectors/{id}:
    get:
      tags:
        - connectors
      summary: Get specific connector details
      operationId: getConnectorById
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  plugin_type:
                    type: string
                  config:
                    type: object
                  status:
                    type: string
                  tasks_count:
                    type: integer
                  created_by:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                  updated_at:
                    type: string
                  created_at:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: Unauthorized
                  value:
                    code: UNAUTHORIZED
                    message: "Missing or invalid token"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  summary: Connector not found
                  value:
                    code: NOT_FOUND
                    message: "Connector not found"
    delete:
      tags:
        - connectors
      summary: Delete a connector
      operationId: deleteConnector
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        '204':
          description: Connector deleted successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: Unauthorized
                  value:
                    code: UNAUTHORIZED
                    message: "Missing or invalid token"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  summary: Connector not found
                  value:
                    code: NOT_FOUND
                    message: "Connector not found"
  /api/v1/connectors/{id}/actions:
    post:
      tags:
        - connectors
      summary: Perform action on a connector
      operationId: connectorAction
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum: [pause, resume, restart]
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  source_db:
                    type: string
                  status:
                    type: string
                  lag:
                    type: integer
                  tasks_count:
                    type: integer
                  created_at:
                    type: string
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                bad_request:
                  summary: Invalid action
                  value:
                    code: BAD_REQUEST
                    message: "Invalid action provided"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: Unauthorized
                  value:
                    code: UNAUTHORIZED
                    message: "Missing or invalid token"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  summary: Connector not found
                  value:
                    code: NOT_FOUND
                    message: "Connector not found"
  /api/v1/connectors/{id}/metrics:
    get:
      tags:
        - connectors
      summary: Get connector metrics
      operationId: getConnectorMetrics
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: interval
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:

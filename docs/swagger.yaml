openapi: 3.0.0
info:
  title: Maestro API
  version: 1.0.0
  description: API for Maestro application
paths:
  /api/v1/login:
    post:
      tags:
        - auth
      summary: User login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: jdoe
                password:
                  type: string
                  example: secret123
      responses:
        '200':
          description: Successful login
          headers:
            Set-Cookie:
              description: Cookie containing refresh_token
              schema:
                type: string
                example: refresh_token=abcde12345; HttpOnly; Path=/
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    example: eyJhb...
                  username:
                    type: string
                    example: jdoe
                  role:
                    type: string
                    example: admin
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation_error:
                  summary: Validation error
                  value:
                    code: BAD_REQUEST
                    message: "Validation failed: missing required fields"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_credentials:
                  summary: Invalid credentials
                  value:
                    code: INVALID_CREDENTIALS
                    message: "Invalid email or password"
  /api/v1/refresh:
    post:
      tags:
        - auth
      summary: Refresh access token
      operationId: refresh
      parameters:
        - in: cookie
          name: refresh_token
          schema:
            type: string
          required: true
          description: The refresh token cookie
      responses:
        '200':
          description: Successful refresh
          headers:
            Set-Cookie:
              description: Cookie containing new refresh_token
              schema:
                type: string
                example: refresh_token=fghij67890; HttpOnly; Path=/
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    example: eyJhb...
        '401':
          description: Unauthorized or invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_token:
                  summary: Invalid refresh token
                  value:
                    code: INVALID_TOKEN
                    message: "Refresh token is expired, missing or invalid"
  /api/v1/logout:
    post:
      tags:
        - auth
      summary: User logout
      operationId: logout
      parameters:
        - in: cookie
          name: refresh_token
          schema:
            type: string
          required: true
          description: The refresh token cookie
      requestBody:
        description: Access token for logging purposes
        content:
          application/json:
            schema:
              type: object
              properties:
                access_token:
                  type: string
                  example: eyJhb...
      responses:
        '200':
          description: Successful logout
          headers:
            Set-Cookie:
              description: Cookie invalidating the refresh_token
              schema:
                type: string
                example: refresh_token=; Max-Age=0; HttpOnly; Path=/
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                bad_request:
                  summary: Invalid request payload
                  value:
                    code: BAD_REQUEST
                    message: "Missing access_token in request body"
  /api/v1/audit-logs:
    get:
      tags:
        - audit
      summary: Get audit logs list
      operationId: getAuditLogs
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: action
          schema:
            type: string
        - in: query
          name: connector
          schema:
            type: string
        - in: query
          name: actor
          schema:
            type: string
        - in: query
          name: start_data
          schema:
            type: string
        - in: query
          name: end_data
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        created_at:
                          type: string
                        action:
                          type: string
                        user_name:
                          type: string
                        user_id:
                          type: string
                        connector_name:
                          type: string
                        connector_id:
                          type: string
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      page:
                        type: integer
                      limit:
                        type: integer
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                bad_request:
                  summary: Invalid query parameters
                  value:
                    code: BAD_REQUEST
                    message: "Invalid query parameters provided"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: Unauthorized
                  value:
                    code: UNAUTHORIZED
                    message: "Missing or invalid token"
  /api/v1/audit-logs/{id}:
    get:
      tags:
        - audit
      summary: Get specific audit log by ID
      operationId: getAuditLogById
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  state_before:
                    type: object
                  state_after:
                    type: object
                  action:
                    type: string
                  connector_name:
                    type: string
                  user_name:
                    type: string
                  user_id:
                    type: string
                  connector_id:
                    type: string
                  created_at:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: Unauthorized
                  value:
                    code: UNAUTHORIZED
                    message: "Missing or invalid token"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  summary: Log not found
                  value:
                    code: NOT_FOUND
                    message: "Audit log with provided ID not found"
  /api/v1/users:
    post:
      tags:
        - users
      summary: Create a new user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
                - role
              properties:
                username:
                  type: string
                  example: newuser
                password:
                  type: string
                  example: secret123
                role:
                  type: string
                  example: admin
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  username:
                    type: string
                  role:
                    type: string
                  created_at:
                    type: string
                  updated_at:
                    type: string
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation_error:
                  summary: Validation error
                  value:
                    code: BAD_REQUEST
                    message: "Validation failed: missing required fields"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: Unauthorized
                  value:
                    code: UNAUTHORIZED
                    message: "Missing or invalid token"
    get:
      tags:
        - users
      summary: Get list of users
      operationId: getUsers
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: username
          schema:
            type: string
        - in: query
          name: role
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        username:
                          type: string
                        role:
                          type: string
                        created_at:
                          type: string
                        updated_at:
                          type: string
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      page:
                        type: integer
                      limit:
                        type: integer
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                bad_request:
                  summary: Invalid query parameters
                  value:
                    code: BAD_REQUEST
                    message: "Invalid query parameters provided"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: Unauthorized
                  value:
                    code: UNAUTHORIZED
                    message: "Missing or invalid token"
  /api/v1/users/{id}:
    get:
      tags:
        - users
      summary: Get user by ID
      operationId: getUserById
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  username:
                    type: string
                  role:
                    type: string
                  created_at:
                    type: string
                  updated_at:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: Unauthorized
                  value:
                    code: UNAUTHORIZED
                    message: "Missing or invalid token"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  summary: User not found
                  value:
                    code: NOT_FOUND
                    message: "User with provided ID not found"
    patch:
      tags:
        - users
      summary: Update user profile
      operationId: updateUser
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: updateduser
                role:
                  type: string
                  enum: [admin, user, viewer]
                  example: user
      responses:
        '200':
          description: Successful update
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  username:
                    type: string
                  role:
                    type: string
                  created_at:
                    type: string
                  updated_at:
                    type: string
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation_error:
                  summary: Validation error
                  value:
                    code: BAD_REQUEST
                    message: "Validation failed"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: Unauthorized
                  value:
                    code: UNAUTHORIZED
                    message: "Missing or invalid token"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  summary: User not found
                  value:
                    code: NOT_FOUND
                    message: "User with provided ID not found"
    delete:
      tags:
        - users
      summary: Delete user
      operationId: deleteUser
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        '204':
          description: User deleted successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: Unauthorized
                  value:
                    code: UNAUTHORIZED
                    message: "Missing or invalid token"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  summary: User not found
                  value:
                    code: NOT_FOUND
                    message: "User with provided ID not found"
  /api/v1/users/{id}/password:
    patch:
      tags:
        - users
      summary: Admin changes user password
      operationId: adminChangeUserPassword
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - new_password
              properties:
                new_password:
                  type: string
                  example: newSecret123
      responses:
        '204':
          description: Password changed successfully
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation_error:
                  summary: Validation error
                  value:
                    code: BAD_REQUEST
                    message: "Validation failed: missing required fields"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: Unauthorized
                  value:
                    code: UNAUTHORIZED
                    message: "Missing or invalid token"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  summary: User not found
                  value:
                    code: NOT_FOUND
                    message: "User not found"
  /api/v1/users/me/password:
    patch:
      tags:
        - users
      summary: User changes their own password
      operationId: changeOwnPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - old_password
                - new_password
              properties:
                old_password:
                  type: string
                  example: oldSecret123
                new_password:
                  type: string
                  example: newSecret123
      responses:
        '204':
          description: Password changed successfully
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation_error:
                  summary: Validation error
                  value:
                    code: BAD_REQUEST
                    message: "Validation failed or incorrect old password"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: Unauthorized
                  value:
                    code: UNAUTHORIZED
                    message: "Missing or invalid token"
  /api/v1/connectors:
    get:
      tags:
        - connectors
      summary: Get connectors list
      operationId: getConnectors
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: name
          schema:
            type: string
        - in: query
          name: source_db
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        source_db:
                          type: string
                        status:
                          type: string
                        lag:
                          type: integer
                        tasks_count:
                          type: integer
                        created_at:
                          type: string
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      page:
                        type: integer
                      limit:
                        type: integer
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                bad_request:
                  summary: Invalid query parameters
                  value:
                    code: BAD_REQUEST
                    message: "Invalid query parameters provided"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: Unauthorized
                  value:
                    code: UNAUTHORIZED
                    message: "Missing or invalid token"
  /api/v1/connectors/stats:
    get:
      tags:
        - connectors
      summary: Get connectors statistics
      operationId: getConnectorsStats
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  failed_connectors:
                    type: integer
                  running_connectors:
                    type: integer
                  paused_connectors:
                    type: integer
                  records_second:
                    type: integer
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: Unauthorized
                  value:
                    code: UNAUTHORIZED
                    message: "Missing or invalid token"

components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: refresh_token
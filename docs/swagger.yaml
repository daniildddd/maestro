                  summary: Access token missing
                  value:
                    code: ACCESS_TOKEN_MISSING
                    message: "Access token missing"
                access_token_expired:
                  summary: Access token expired
                  value:
                    code: ACCESS_TOKEN_EXPIRED
                    message: "Access token expired"
                access_token_invalid:
                  summary: Invalid access token
                  value:
                    code: ACCESS_TOKEN_INVALID
                    message: "Invalid access token"
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  summary: Forbidden
                  value:
                    code: FORBIDDEN
                    message: "Forbidden"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  summary: User not found
                  value:
                    code: USER_NOT_FOUND
                    message: "User with provided ID not found"
    patch:
      tags:
        - users
      summary: Update user profile
      operationId: updateUser
      x-required-roles: [user, admin]
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 32
                  pattern: '^[a-zA-Z0-9_-]+$'
                  example: updateduser
      responses:
        '200':
          description: Successful update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation_error:
                  summary: Validation error
                  value:
                    code: VALIDATION_FAILED
                    message: "Validation failed"
                invalid_path_param:
                  summary: Invalid path parameter
                  value:
                    code: INVALID_PATH_PARAM
                    message: "Invalid path parameter"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                access_token_missing:
                  summary: Access token missing
                  value:
                    code: ACCESS_TOKEN_MISSING
                    message: "Access token missing"
                access_token_expired:
                  summary: Access token expired
                  value:
                    code: ACCESS_TOKEN_EXPIRED
                    message: "Access token expired"
                access_token_invalid:
                  summary: Invalid access token
                  value:
                    code: ACCESS_TOKEN_INVALID
                    message: "Invalid access token"
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  summary: Forbidden
                  value:
                    code: FORBIDDEN
                    message: "Forbidden"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  summary: User not found
                  value:
                    code: USER_NOT_FOUND
                    message: "User with provided ID not found"
    delete:
      tags:
        - users
      summary: Delete user
      operationId: deleteUser
      x-required-roles: [admin]
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
      responses:
        '204':
          description: User deleted successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                access_token_missing:
                  summary: Access token missing
                  value:
                    code: ACCESS_TOKEN_MISSING
                    message: "Access token missing"
                access_token_expired:
                  summary: Access token expired
                  value:
                    code: ACCESS_TOKEN_EXPIRED
                    message: "Access token expired"
                access_token_invalid:
                  summary: Invalid access token
                  value:
                    code: ACCESS_TOKEN_INVALID
                    message: "Invalid access token"
        '403':
